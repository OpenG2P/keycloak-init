apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak-init.fullname" . }}-config
  labels:
    {{- include "keycloak-init.labels" . | nindent 4 }}
data:
  clients.yaml: |
    realms:
    {{- range $realmName, $realmDef := .Values.realms }}
      {{ tpl $realmName $ }}:
        {{- if and $realmDef $realmDef.themes }}
        themes:
          {{- tpl (toYaml $realmDef.themes) $ | nindent 10 }}
        {{- end }}
        clients:
        {{- if and $realmDef $realmDef.clients }}
        {{- tpl (toYaml $realmDef.clients) $ | nindent 8 }}
        {{- else }} []
        {{- end }}
        {{- if and $realmDef $realmDef.users }}
        users:
        {{- tpl (toYaml $realmDef.users) $ | nindent 8 }}
        {{- end }}
    {{- end }}
