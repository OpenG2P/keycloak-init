{{- /*
  Job name = fullname + revision + a hash of everything that shapes the pod
  template.

  A Job's spec.template is immutable, and this template generates one volume and
  one volumeMount per confidential client in .Values.realms — so adding a realm
  or a client changes the pod template. .Release.Revision alone does not
  distinguish that, because a FAILED install does not advance the revision:
  retrying it (or reinstalling after an uninstall that left the Job behind)
  regenerates the same name against a changed template, and the apply fails with

      Job.batch "<name>" is invalid: spec.template: field is immutable

  Helm then fails the whole release, which skips every post-install hook in the
  parent chart — so unrelated things like database seeding silently never run.
  One stale Job takes the entire install down.

  Hashing the inputs means a changed template always gets a new name, so the
  apply cannot conflict. Helm prunes the old Job on the next successful upgrade.

  The 63 is deliberate, not 253: the name is copied into the
  batch.kubernetes.io/job-name LABEL and label values cap at 63, so a name
  Kubernetes would accept as a DNS subdomain can still fail Job creation.
  keycloak-init.fullname already truncates to 63 by itself, leaving no room for
  the suffix, so the base is trimmed by exactly the suffix length.
*/ -}}
{{- $podHash := printf "%s|%s|%s" (toYaml .Values.realms) (toYaml .Values.keycloak) (toYaml .Values.image) | sha256sum | trunc 8 -}}
{{- $suffix := printf "-%v-%s" .Release.Revision $podHash -}}
{{- $base := include "keycloak-init.fullname" . | trunc (int (sub 63 (len $suffix))) | trimSuffix "-" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $base }}{{ $suffix }}
  labels:
    {{- include "keycloak-init.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "keycloak-init.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KEYCLOAK_URL
              value: {{ tpl (coalesce .Values.keycloak.url .Values.global.keycloakBaseUrl) . | quote }}
            - name: KEYCLOAK_USER
              value: {{ .Values.keycloak.user | quote }}
            - name: KEYCLOAK_PASSWORD
              {{- if .Values.keycloak.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.keycloak.existingSecret . }}
                  key: {{ .Values.keycloak.existingSecretKey }}
              {{- else }}
              value: {{ .Values.keycloak.password | quote }}
              {{- end }}
            - name: INPUT_FILE
              value: "/config/clients.yaml"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- range $realmName, $realmDef := .Values.realms }}
            {{- if $realmDef }}
            {{- range ($realmDef.clients | default list) }}
            {{- if not .publicClient }}
            {{- $clientId := tpl .clientId $ }}
            - name: secret-{{ $clientId }}
              mountPath: /secrets/{{ $clientId }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "keycloak-init.fullname" . }}-config
        {{- range $realmName, $realmDef := .Values.realms }}
        {{- if $realmDef }}
        {{- range ($realmDef.clients | default list) }}
        {{- if not .publicClient }}
        {{- $clientId := tpl .clientId $ }}
        - name: secret-{{ $clientId }}
          secret:
            secretName: {{ $clientId }}
            items:
              - key: client_secret
                path: client_secret
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
