apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "keycloak-init.fullname" . }}-{{ .Release.Revision }}
  labels:
    {{- include "keycloak-init.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "keycloak-init.labels" . | nindent 8 }}
    spec:
      {{- $suffix := tpl .Values.suffix . }}
      {{- $ctx := merge (dict "suffix" $suffix) . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KEYCLOAK_URL
              value: {{ tpl .Values.keycloak.url . | quote }}
            - name: KEYCLOAK_USER
              value: {{ .Values.keycloak.user | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_PASSWORD
              {{- if .Values.keycloak.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.existingSecret }}
                  key: {{ .Values.keycloak.existingSecretKey }}
              {{- else }}
              value: {{ .Values.keycloak.password | quote }}
              {{- end }}
            - name: INPUT_FILE
              value: "/config/clients.yaml"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- range .Values.clients }}
            - name: secret-{{ tpl .clientId $ctx }}
              mountPath: /secrets/{{ tpl .clientId $ctx }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "keycloak-init.fullname" . }}-config
        {{- range .Values.clients }}
        - name: secret-{{ tpl .clientId $ctx }}
          secret:
            secretName: {{ tpl .clientId $ctx }}
            items:
              - key: client_secret
                path: client_secret
        {{- end }}
