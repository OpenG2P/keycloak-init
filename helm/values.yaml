image:
  repository: openg2p/keycloak-init
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

global:
  keycloakBaseUrl: ""

keycloak:
  # Keycloak URL. If empty, falls back to global.keycloakBaseUrl
  url: "https://keycloak2.openg2p.org"
  user: "admin"
  # Use secret instead of directly passing password here
  password: ""
  # If you want to use an existing secret for password
  existingSecret: "keycloak-admin"
  existingSecretKey: "keycloak-admin-password"

# Realms and their clients. No defaults — parent/caller chart must define these.
# If a realm does not exist in Keycloak, it will be created automatically.
# Existing realms are left untouched. Entire operation is idempotent.
#
# Structure:
#   realms:
#     <realm-name>:                     # Realm name as key. Created if absent.
#       themes:                         # (optional) Keycloak themes for this realm
#         loginTheme: <string>          # (optional) Login page theme name
#         adminTheme: <string>          # (optional) Admin console theme name
#       clients:
#         - clientId: <string>          # (required) Unique client identifier
#           name: <string>              # (optional) Display name. Defaults to clientId
#           redirectUris:               # (optional) List of redirect URIs. Defaults to ["*"]
#             - "*"
#           secret: <string>            # (optional) Client secret. If omitted, auto-generated
#                                       #   and stored as a K8s Secret (recommended)
#           clientRoles:                # (optional) List of client roles to create
#             - <string>                # Simple role (just a name)
#             - name: <string>          # Composite role
#               composites:             #   List of child role names contained in this role
#                 - <string>
#
# Example:
#   realms:
#     master:
#       themes:
#         loginTheme: openg2p-admin
#         adminTheme: openg2p-admin
#       clients: []
#     staff:
#       themes:
#         loginTheme: staff-portal
#         adminTheme: staff-portal
#       clients:
#         - clientId: my-app
#           name: My Application
#           redirectUris:
#             - "*"
#           clientRoles:
#             - viewer
#             - editor
#             - name: admin
#               composites:
#                 - viewer
#                 - editor
#     agent:
#       clients: []
#
realms: {}
job:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
