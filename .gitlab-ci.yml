# keycloak-init — build & publish on GitLab.
#
# Hand-written (passed to the migration script with --ci) because this repo was
# never on the central GitHub pipeline: it had the OLD split workflows
# (docker-publish.yml + helm-publish.yml, publishing to Docker Hub) rather than a
# build-publish.yml caller, so there was nothing to translate.
#
# All versioning/build/publish logic lives centrally in openg2p/packaging@v1;
# this file only declares what THIS repo has. One immutable version per commit,
# chart and image in lockstep.
#
#   image -> registry.gitlab.com/openg2p/keycloak/keycloak-init/keycloak-init
#   chart -> openg2p/charts Helm registry   (shared catalogue)

include:
  - project: 'openg2p/packaging'
    ref: v1
    file: '/ci/gitlab/build-publish.yml'

variables:
  PACKAGING_REF: v1

  # Build context is docker/ -- the Dockerfile COPYs create_clients.py from the
  # context root, exactly as the old docker-publish.yml did.
  IMAGES: |
    [
      {
        "name": "keycloak-init",
        "dockerfile": "docker/Dockerfile",
        "context": "docker"
      }
    ]

  # The chart lives at the repo root's helm/ (no per-chart subdirectory here).
  CHART_PATH: helm
  CHART_IMAGE_PATHS: '[".image.tag"]'
  CHART_GITLAB_PROJECT: openg2p/charts
